name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate plugin
        run: node scripts/validate-plugin.mjs

      - name: Test safety guard
        run: node scripts/test-guard.mjs

      - name: Build CLI
        run: go build -trimpath -o bin/autoco ./cmd/autoco
